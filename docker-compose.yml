services:
  property-manager:
    build: .
    container_name: nexera-property-oss
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      - APP_USERNAME=${APP_USERNAME:-admin}
      - APP_PASSWORD=${APP_PASSWORD:?Set APP_PASSWORD in .env before starting}
      - DEMO_MODE=${DEMO_MODE:-}
      - ALLOW_PASSWORD_RESET=${ALLOW_PASSWORD_RESET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS=${SMTP_TLS:-}
      - PASSWORD_RESET_EMAIL=${PASSWORD_RESET_EMAIL:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - WAITLIST_URL=${WAITLIST_URL:-https://www.nexerav.com}
    restart: unless-stopped
